openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /health:
    get:
      operationId: getServiceStatus
      responses:
        "200":
          description: Integration readiness without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listings:
    get:
      operationId: getListings
      parameters:
        - { in: query, name: mine, schema: { type: boolean } }
      responses:
        "200":
          description: Public eligible listings, or owner's listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
    post:
      operationId: publishListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Listing and validated matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listing-photos:
    post:
      operationId: uploadListingPhoto
      summary: Upload an authenticated owner's private JPG, PNG or WebP photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PhotoUpload" }
      responses:
        "201":
          description: Sanitized private photo ID and owner preview URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listing-photos/{photoId}:
    parameters:
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getListingPhoto
      responses:
        "200":
          description: Owner preview, or a photo attached to a publicly available listing
          content:
            image/jpeg:
              schema: { type: string, format: binary }
    delete:
      operationId: deleteUnpostedListingPhoto
      responses:
        "200":
          description: Owner-only deletion of an unposted photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listings/review:
    post:
      operationId: reviewListing
      summary: Require complete fields and real Bob image approval; never publishes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "200":
          description: Owner-bound single-use approval valid for these exact fields/photo for 15 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
        "422":
          description: Rejected or uncertain photo; publishing remains blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateReviewedListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingChange" }
      responses:
        "200":
          description: Updated listing; changed fields require a fresh single-use approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
    delete:
      operationId: withdrawListing
      responses:
        "200":
          description: Owner withdrew an unreserved listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /interpret-listing:
    post:
      operationId: interpretListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterpretationInput" }
      responses:
        "200":
          description: Editable draft, original text and ambiguities; never saves a listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listings/{id}/matches:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getListingMatches
      responses:
        "200":
          description: Server validated reciprocal, quantity-compatible matches with pickup overlap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /listings/{id}/fallback-options:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getFallbackOptions
      responses:
        "200":
          description: Matches, owner-approved giveaway choice and researched destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /donation-locations:
    get:
      operationId: getDonationLocations
      summary: Browse the existing donation directory without an account or listing
      responses:
        "200":
          description: Researched donation locations, coverage notice and routing availability; not item-specific acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /donation-locations/routes:
    post:
      operationId: searchDonationLocationRoutes
      summary: Optional driving times to the existing directory; no listing or account required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DonationRouteInput" }
      responses:
        "200":
          description: Existing directory destinations sorted and filtered by live driving time; not item-specific acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
        "400":
          description: Invalid search area or drive limit
        "502":
          description: Routing provider unavailable; directory remains accessible
        "503":
          description: Driving-time search is not configured; directory remains accessible
  /listings/{id}/donation-routes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: findDonationRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DonationRouteInput" }
      responses:
        "200":
          description: Compatible verified donation destinations sorted and filtered by live driving time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /offers:
    get:
      operationId: getOffers
      responses:
        "200":
          description: Participant offers including fixed contents and pickup window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
    post:
      operationId: proposeOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Exact contents derived by the server, never from client quantities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /offers/{id}/respond:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: respondToOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "200":
          description: Atomic acceptance or decline, conflict returns 409
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /offers/{id}/confirm-pickup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmPickup
      responses:
        "200":
          description: One participant confirmation; completed only after both
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /outcomes:
    post:
      operationId: recordExternalOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "201":
          description: Idempotent user-reported external outcome, not a recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
  /impact:
    get:
      operationId: getCommunityImpact
      summary: Get the signed-in user's own impact
      responses:
        "200":
          description: Only this user's completed handoffs as giver or receiver and their own donation/compost reports; server-filtered by authenticated user ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonResult" }
        "401":
          description: Sign in to see your impact
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PhotoUpload:
      type: object
      required: [photo]
      properties:
        photo: { type: string, format: binary }
    ListingChange:
      oneOf:
        - { $ref: "#/components/schemas/ListingInput" }
        - type: object
          required: [inedible_confirmed]
          properties:
            inedible_confirmed: { type: boolean, enum: [true] }
    JsonResult:
      type: object
      additionalProperties: true
    InterpretationInput:
      type: object
      required: [text, timezone]
      properties:
        text: { type: string, minLength: 1, maxLength: 1200 }
        timezone: { type: string }
    FoodItem:
      type: object
      required: [name, quantity, category]
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unit: { type: string, default: each, enum: [each, g, kg, oz, lb, bag, can, box, bottle, package], description: "Count-only forms send each; other values remain for historical compatibility." }
        category: { type: string, enum: [produce, shelf_stable] }
        unopened: { type: [boolean, "null"] }
        printed_date: { type: [string, "null"], format: date, description: "Two calendar years ago through ten ahead in the listing timezone. Past use_by and expiration are rejected; past best_by warns." }
        date_type: { type: [string, "null"], enum: [best_by, use_by, sell_by, expiration, null] }
    ListingInput:
      allOf:
        - { $ref: "#/components/schemas/ListingDraft" }
        - type: object
          required: [approval_id]
          properties:
            approval_id: { type: string, format: uuid }
    ListingDraft:
      type: object
      required: [mode, listing_type, item_details, location, pickup_start, pickup_end, deadline, timezone, fresh, storage_confirmed, allergens, photo_id]
      properties:
        mode: { type: string, enum: [exchange, giveaway] }
        listing_type: { type: string, enum: [single, bundle] }
        item_details:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/FoodItem" }
        wanted_food: { type: string }
        wanted_quantity: { type: integer, minimum: 1, maximum: 99 }
        wanted_unit: { type: string, default: each, enum: [each, g, kg, oz, lb, bag, can, box, bottle, package] }
        location: { type: string }
        pickup_start: { type: string, format: date-time, description: "Timezone required; now through one calendar year ahead, strictly before pickup_end." }
        pickup_end: { type: string, format: date-time, description: "After pickup_start, no later than deadline or one calendar year ahead." }
        deadline: { type: string, format: date-time, description: "Available until; no earlier than pickup_end and no later than one calendar year ahead." }
        timezone: { type: string }
        fresh: { type: boolean }
        storage_confirmed: { type: boolean }
        allergens: { type: string, minLength: 1, maxLength: 200 }
        photo_id: { type: string, format: uuid }
    OfferInput:
      type: object
      required: [listing_id, match_id]
      properties:
        listing_id: { type: string }
        match_id: { type: string }
    DecisionInput:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
    DonationRouteInput:
      type: object
      required: [area, max_drive_minutes]
      properties:
        area: { type: string, minLength: 2, maxLength: 100 }
        max_drive_minutes: { type: integer, enum: [15, 30, 60] }
    OutcomeInput:
      type: object
      required: [listing_id, destination_id, action, confirmed]
      properties:
        listing_id: { type: string }
        destination_id: { type: string }
        action: { type: string, enum: [donation, compost] }
        confirmed: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

